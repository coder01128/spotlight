
<style>
*{margin:0;padding:0;box-sizing:border-box;}
#app{width:1280px;height:720px;position:relative;background:#000;font-family:Impact,'Arial Black',sans-serif;overflow:hidden;}
#wheelCanvas,#introCanvas{position:absolute;left:0;top:0;width:1280px;height:720px;}
#introCanvas{display:none;}
#spinBtn{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);background:transparent;border:3px solid #00F5FF;color:#00F5FF;font-family:Impact,sans-serif;font-size:26px;letter-spacing:4px;padding:12px 44px;cursor:pointer;text-shadow:0 0 20px #00F5FF;box-shadow:0 0 30px rgba(0,245,255,0.4);transition:all 0.2s;z-index:10;}
#spinBtn:hover{background:rgba(0,245,255,0.1);box-shadow:0 0 60px rgba(0,245,255,0.8);}
#spinBtn:disabled{opacity:0.25;cursor:default;}
#skipBtn{position:absolute;bottom:36px;right:36px;background:transparent;border:2px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.4);font-family:Impact,sans-serif;font-size:15px;letter-spacing:2px;padding:9px 22px;cursor:pointer;z-index:10;display:none;}
#skipBtn:hover{border-color:rgba(255,255,255,0.5);color:rgba(255,255,255,0.7);}
#actLabel{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:#FF2D78;font-size:20px;letter-spacing:6px;text-shadow:0 0 20px #FF2D78;z-index:10;opacity:0;transition:opacity 0.5s;white-space:nowrap;}
#countLabel{position:absolute;top:22px;right:36px;color:rgba(255,255,255,0.3);font-size:14px;letter-spacing:3px;z-index:10;}
</style>
<div id="app">
  <canvas id="wheelCanvas" width="1280" height="720"></canvas>
  <canvas id="introCanvas" width="1280" height="720"></canvas>
  <div id="actLabel">NEXT ACT</div>
  <div id="countLabel" id="countLabel"></div>
  <button id="spinBtn">⚡ SPIN THE WHEEL</button>
  <button id="skipBtn">SKIP ▶</button>
</div>
<script>
const ALL_ACTS=["TREVOR NOAH","DAVE CHAPPELLE","RIAAD MOOSA","GABRIEL IGLESIAS","TUMI MORAKE","RON WHITE","LOYISO GOLA","ALI WONG"];
const PINK='#FF2D78',CYAN='#00F5FF',YELLOW='#FFFF00',PURPLE='#BF00FF',WHITE='#FFFFFF',ORANGE='#FF6600',GREEN='#00FF88';
const NEONS=[PINK,CYAN,YELLOW,PURPLE,ORANGE,GREEN,PINK,CYAN];
const W=1280,H=720,CX=W/2,CY=H/2,RADIUS=255;
function rand(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function rgba(h,a){const c=hexRgb(h);return`rgba(${c.r},${c.g},${c.b},${a})`;}
function easeOut(t){return 1-Math.pow(1-t,4);}
function easeOutBounce(t){const n1=7.5625,d1=2.75;if(t<1/d1)return n1*t*t;else if(t<2/d1)return n1*(t-=1.5/d1)*t+0.75;else if(t<2.5/d1)return n1*(t-=2.25/d1)*t+0.9375;else return n1*(t-=2.625/d1)*t+0.984375;}

// State
let remaining=[...ALL_ACTS];
let calledActs=[];
let angle=0,spinning=false,velocity=0;
const spinBtn=document.getElementById('spinBtn');
const skipBtn=document.getElementById('skipBtn');
const actLabel=document.getElementById('actLabel');
const countLabel=document.getElementById('countLabel');

// Stars
const stars=Array.from({length:200},()=>({x:rand(0,W),y:rand(0,H),r:rand(0.4,2.2),a:rand(0.1,1),da:rand(0.008,0.03)}));

// ---- WHEEL ----
const wc=document.getElementById('wheelCanvas');
const wctx=wc.getContext('2d');

function updateCount(){countLabel.textContent=`${remaining.length} ACTS REMAINING`;}
updateCount();

function drawWheel(){
  wctx.clearRect(0,0,W,H);
  wctx.fillStyle='#000';wctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){s.a+=s.da*(Math.random()>0.5?1:-1);s.a=Math.max(0.05,Math.min(1,s.a));wctx.beginPath();wctx.arc(s.x,s.y,s.r,0,Math.PI*2);wctx.fillStyle=`rgba(255,255,255,${s.a})`;wctx.fill();}
  const N=remaining.length;
  if(N===0){
    wctx.textAlign='center';wctx.textBaseline='middle';
    wctx.font='bold 48px Impact';wctx.fillStyle=YELLOW;wctx.shadowColor=YELLOW;wctx.shadowBlur=30;
    wctx.fillText("THAT'S A WRAP!",CX,CY);
    wctx.font='bold 22px Impact';wctx.fillStyle=CYAN;wctx.shadowColor=CYAN;
    wctx.fillText('ALL ACTS CALLED',CX,CY+70);
    wctx.shadowBlur=0;return;
  }
  const SLICE=(Math.PI*2)/N;
  // outer glow
  const og=wctx.createRadialGradient(CX,CY,RADIUS-5,CX,CY,RADIUS+25);
  og.addColorStop(0,rgba(CYAN,0.5));og.addColorStop(1,rgba(CYAN,0));
  wctx.beginPath();wctx.arc(CX,CY,RADIUS+18,0,Math.PI*2);
  wctx.strokeStyle=og;wctx.lineWidth=10;wctx.stroke();
  // slices
  for(let i=0;i<N;i++){
    const s=angle+i*SLICE,e=s+SLICE,m=s+SLICE/2;
    wctx.beginPath();wctx.moveTo(CX,CY);wctx.arc(CX,CY,RADIUS,s,e);wctx.closePath();
    const col=NEONS[i%NEONS.length];
    const sg=wctx.createRadialGradient(CX,CY,0,CX,CY,RADIUS);
    sg.addColorStop(0,'rgba(0,0,0,0.85)');sg.addColorStop(0.55,rgba(col,0.12));sg.addColorStop(1,rgba(col,0.4));
    wctx.fillStyle=sg;wctx.fill();
    wctx.strokeStyle=rgba(col,0.75);wctx.lineWidth=1.5;wctx.stroke();
    // text
    wctx.save();wctx.translate(CX,CY);wctx.rotate(m);
    wctx.textAlign='right';wctx.textBaseline='middle';
    const nm=remaining[i];const fs=nm.length>13?13:15;
    wctx.font=`bold ${fs}px Impact,sans-serif`;
    wctx.shadowColor=col;wctx.shadowBlur=14;wctx.fillStyle=WHITE;
    wctx.fillText(nm,RADIUS-14,0);wctx.shadowBlur=0;wctx.restore();
  }
  // hub
  const hg=wctx.createRadialGradient(CX,CY,0,CX,CY,40);
  hg.addColorStop(0,'#1a1a1a');hg.addColorStop(1,'#000');
  wctx.beginPath();wctx.arc(CX,CY,40,0,Math.PI*2);
  wctx.fillStyle=hg;wctx.fill();
  wctx.strokeStyle=CYAN;wctx.lineWidth=3;wctx.shadowColor=CYAN;wctx.shadowBlur=22;wctx.stroke();wctx.shadowBlur=0;
  wctx.font='bold 12px Impact';wctx.textAlign='center';wctx.textBaseline='middle';
  wctx.fillStyle=CYAN;wctx.fillText('SPOT',CX,CY-8);wctx.fillText('LIGHT',CX,CY+8);
  // pointer
  const px=CX+RADIUS+26;
  wctx.beginPath();wctx.moveTo(px+24,CY);wctx.lineTo(px,CY-15);wctx.lineTo(px,CY+15);wctx.closePath();
  wctx.fillStyle=PINK;wctx.shadowColor=PINK;wctx.shadowBlur=28;wctx.fill();wctx.shadowBlur=0;
  // title
  wctx.textAlign='center';wctx.font='bold 17px Impact';wctx.fillStyle=YELLOW;
  wctx.shadowColor=YELLOW;wctx.shadowBlur=14;
  wctx.fillText('S P O T L I G H T  —  C O M E D Y  N I G H T',CX,36);wctx.shadowBlur=0;
  // called acts strip
  if(calledActs.length>0){
    wctx.font='bold 11px Impact';wctx.textAlign='left';
    wctx.fillStyle=rgba(WHITE,0.25);
    wctx.fillText('CALLED: '+calledActs.join('  ·  '),20,H-18);
  }
}

function getActUnderPointer(){
  const N=remaining.length;if(!N)return 0;
  const SLICE=(Math.PI*2)/N;
  let a=((-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  return Math.floor(a/SLICE)%N;
}

spinBtn.addEventListener('click',()=>{
  if(spinning||remaining.length===0)return;
  spinning=true;spinBtn.disabled=true;actLabel.style.opacity='0';
  const N=remaining.length;
  const SLICE=(Math.PI*2)/N;
  const target=Math.floor(Math.random()*N);
  const fullSpins=rand(6,11)*Math.PI*2;
  const targetAngle=-(target*SLICE+SLICE/2);
  const norm=((targetAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const extra=(Math.PI*2-((angle+fullSpins)%(Math.PI*2))+norm)%(Math.PI*2);
  velocity=(fullSpins+extra)/130;
  let totalRot=0;const totalTarget=fullSpins+extra;
  function frame(){
    const fric=0.974-(totalRot/totalTarget)*0.018;
    velocity*=fric;
    if(velocity<0.0018){
      velocity=0;spinning=false;
      const landed=getActUnderPointer();
      const actName=remaining[landed];
      actLabel.textContent=actName;actLabel.style.opacity='1';
      // Remove from wheel after brief pause
      setTimeout(()=>{
        calledActs.push(actName);
        remaining.splice(landed,1);
        updateCount();
        if(remaining.length===0)spinBtn.style.display='none';
        fireIntro(actName);
      },700);
      return;
    }
    angle+=velocity;totalRot+=velocity;
    drawWheel();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

function idleLoop(){if(!spinning)drawWheel();requestAnimationFrame(idleLoop);}
requestAnimationFrame(idleLoop);

// ---- INTRO ENGINE ----
const ic=document.getElementById('introCanvas');
const ictx=ic.getContext('2d');
let iT=0,iName='',iActive=false;
let iPart=[],iShock=[],iBolts=[],iLetters=[],iEmbers=[];
let spotX=0,spotY=H/2,spotPhase=0;
let freezeFrame=false,freezeT=0;

function buildLetters(name){
  ictx.font=`bold ${Math.floor(H*0.16)}px Impact,sans-serif`;
  ictx.textBaseline='middle';
  // scale to fit
  let fs=Math.floor(H*0.16);
  let tw=ictx.measureText(name).width;
  while(tw>W*0.88&&fs>30){fs--;ictx.font=`bold ${fs}px Impact,sans-serif`;tw=ictx.measureText(name).width;}
  let x=CX-tw/2;
  iLetters=[];
  for(let i=0;i<name.length;i++){
    const ch=name[i];const cw=ictx.measureText(ch).width;
    // varied launch origins — more dramatic spread
    const origins=[[rand(-200,-50),rand(-100,H+100)],[rand(W+50,W+200),rand(-100,H+100)],[rand(0,W),rand(-200,-50)],[rand(0,W),rand(H+50,H+200)],[rand(-300,-100),rand(-200,0)],[rand(W+100,W+300),rand(H,H+200)]];
    const o=origins[i%origins.length];
    iLetters.push({ch,finalX:x+cw/2,finalY:CY,x:o[0],y:o[1],color:NEONS[i%NEONS.length],scale:rand(5,12),rotation:rand(-Math.PI*3,Math.PI*3),progress:0,delay:i*0.042,charW:cw,fs,landed:false});
    x+=cw;
  }
}

function addShock(x,y,col,spd){iShock.push({x,y,r:0,col,alpha:1,speed:spd||rand(22,36)});}
function spawnPart(x,y,n,col,opts){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),sp=rand(opts&&opts.minSp||3,opts&&opts.maxSp||22);
    iPart.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*(opts&&opts.up?-1:1),alpha:1,size:rand(opts&&opts.minS||2,opts&&opts.maxS||9),color:col||pick(NEONS),life:rand(0.5,1.4),gravity:opts&&opts.gravity!==undefined?opts.gravity:0.35,bounce:opts&&opts.bounce||false,floor:H*0.92});
  }
}
function spawnEmbers(x,y,n){
  for(let i=0;i<n;i++){
    iEmbers.push({x,y,vx:rand(-6,6),vy:rand(-14,-3),alpha:rand(0.6,1),size:rand(1,4),color:pick([ORANGE,YELLOW,PINK,WHITE]),life:rand(0.6,2.0)});
  }
}
function makeBolt(x1,y1,x2,y2,col){
  const pts=[[x1,y1]];
  for(let i=1;i<16;i++){pts.push([x1+(x2-x1)*(i/16)+rand(-80,80),y1+(y2-y1)*(i/16)+rand(-55,55)]);}
  pts.push([x2,y2]);
  iBolts.push({pts,col,alpha:1,w:rand(1.5,4.5)});
}

function drawSpotlight(progress){
  // Spotlight beam sweeps left to right then locks on name
  const beamAlpha=Math.min(1,progress*3)*0.18;
  const lockProgress=Math.min(1,Math.max(0,(progress-0.4)/0.6));
  const sweepX=lockProgress<1?rand(0,W):CX;
  const beamTop=0;
  // beam cone
  const coneW=120+lockProgress*(-60);
  ictx.save();
  const bg=ictx.createLinearGradient(sweepX,beamTop,sweepX,H*0.55);
  bg.addColorStop(0,`rgba(255,240,200,${beamAlpha*1.5})`);
  bg.addColorStop(1,`rgba(255,240,200,0)`);
  ictx.beginPath();
  ictx.moveTo(sweepX,beamTop);
  ictx.lineTo(sweepX-coneW,H*0.55);
  ictx.lineTo(sweepX+coneW,H*0.55);
  ictx.closePath();
  ictx.fillStyle=bg;ictx.fill();
  ictx.restore();
}

function drawIntro(){
  const dt=1/60;iT+=dt;
  ictx.clearRect(0,0,W,H);
  ictx.fillStyle='#000';ictx.fillRect(0,0,W,H);

  // STAGE 1: NOISE STORM 0-0.45s
  if(iT<0.45){
    for(let i=0;i<250;i++){ictx.fillStyle=pick(NEONS);ictx.globalAlpha=rand(0.15,0.95);ictx.fillRect(rand(0,W),rand(0,H),rand(2,12),rand(2,12));}
    ictx.globalAlpha=1;
    if(iT>0.25&&iShock.length===0){
      addShock(CX,CY,CYAN,30);addShock(CX,CY,PINK,24);addShock(CX,CY,YELLOW,18);addShock(CX,CY,PURPLE,14);
      spawnPart(CX,CY,200,null,{minSp:5,maxSp:28,minS:2,maxS:10});
      spawnEmbers(CX,CY,80);
    }
  }

  // SPOTLIGHT SWEEP 0.3-2.0s
  if(iT>=0.3&&iT<2.0) drawSpotlight((iT-0.3)/1.7);

  // SHOCKWAVES
  iShock=iShock.filter(s=>s.alpha>0.01);
  for(const s of iShock){
    s.r+=s.speed;s.alpha-=0.018;
    const c=hexRgb(s.col);
    ictx.beginPath();ictx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ictx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${Math.max(0,s.alpha)})`;
    ictx.lineWidth=3.5;ictx.stroke();
  }

  // PARTICLES with floor bounce
  iPart=iPart.filter(p=>p.alpha>0.02);
  for(const p of iPart){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.985;
    if(p.bounce&&p.y>p.floor){p.y=p.floor;p.vy*=-0.45;p.vx*=0.8;}
    p.alpha-=dt/p.life;
    const c=hexRgb(p.color);
    ictx.fillStyle=`rgba(${c.r},${c.g},${c.b},${Math.max(0,p.alpha)})`;
    ictx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }

  // EMBERS
  iEmbers=iEmbers.filter(e=>e.alpha>0.02);
  for(const e of iEmbers){
    e.x+=e.vx;e.y+=e.vy;e.vy+=0.18;e.vx*=0.99;e.alpha-=dt/e.life;
    const c=hexRgb(e.color);
    ictx.save();ictx.beginPath();ictx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ictx.fillStyle=`rgba(${c.r},${c.g},${c.b},${Math.max(0,e.alpha)})`;
    ictx.shadowColor=e.color;ictx.shadowBlur=8;ictx.fill();ictx.restore();
  }

  // LETTERS FLY IN 0.4-1.2s
  if(iT>=0.4){
    for(const l of iLetters){
      const lt=Math.max(0,(iT-0.4-l.delay)/0.55);
      l.progress=Math.min(1,lt);
      const ep=easeOut(l.progress);
      const cx=l.x+(l.finalX-l.x)*ep;
      const cy=l.y+(l.finalY-l.y)*ep;
      const rot=l.rotation*(1-ep);
      const sc=l.scale+(1-l.scale)*ep;
      // On landing — spawn particles + embers
      if(l.progress>=1&&!l.landed){
        l.landed=true;
        spawnPart(l.finalX,l.finalY,30,l.color,{minSp:3,maxSp:12,minS:1,maxS:5,gravity:0.4,bounce:true});
        spawnEmbers(l.finalX,l.finalY,15);
        addShock(l.finalX,l.finalY,l.color,8);
      }
      ictx.save();ictx.translate(cx,cy);ictx.rotate(rot);ictx.scale(sc,sc);
      // Deep glow layers
      ictx.shadowColor=l.color;ictx.shadowBlur=60;ictx.fillStyle=l.color;ictx.globalAlpha=0.3;ictx.fillText(l.ch,-l.charW/2,0);
      ictx.shadowBlur=30;ictx.globalAlpha=0.5;ictx.fillText(l.ch,-l.charW/2,0);
      ictx.shadowBlur=0;ictx.globalAlpha=1;
      // colour cycle
      let col=WHITE;
      if(iT>1.35&&iT<2.0){const cy2=(iT-1.35)*7;col=NEONS[Math.floor(cy2+iLetters.indexOf(l)*0.35)%NEONS.length];}
      ictx.shadowColor=col===WHITE?CYAN:col;ictx.shadowBlur=28;ictx.fillStyle=col;
      const fadeOut=iT>5.6?Math.max(0,1-(iT-5.6)*2.2):1;
      ictx.globalAlpha=fadeOut;ictx.fillText(l.ch,-l.charW/2,0);
      ictx.restore();
    }
    ictx.shadowBlur=0;ictx.globalAlpha=1;
  }

  // BASS DROP FREEZE FRAME at t=1.05
  if(iT>=1.04&&iT<1.1){
    ictx.fillStyle=`rgba(255,255,255,${0.95-(iT-1.04)*16})`;
    ictx.fillRect(0,0,W,H);
    if(iT>=1.04&&iT<1.07){
      spawnPart(CX,CY,180,null,{minSp:8,maxSp:35,minS:3,maxS:12,gravity:0.5,bounce:true});
      spawnEmbers(CX,H*0.5,120);
      for(let i=0;i<8;i++)addShock(rand(0,W),rand(0,H),pick(NEONS),rand(15,40));
    }
  }

  // CHROMATIC ABERRATION 1.1-1.5s
  if(iT>=1.1&&iT<1.5){
    const str=Math.sin((iT-1.1)/0.4*Math.PI)*18;
    ictx.font=`bold ${iLetters[0]?.fs||Math.floor(H*0.16)}px Impact,sans-serif`;
    ictx.textBaseline='middle';
    const tw=ictx.measureText(iName).width;
    const adjX=CX-tw/2;
    ictx.save();ictx.globalAlpha=0.3;ictx.translate(-str,4);ictx.fillStyle=PINK;ictx.shadowColor=PINK;ictx.shadowBlur=25;ictx.fillText(iName,adjX,CY);ictx.restore();
    ictx.save();ictx.globalAlpha=0.3;ictx.translate(str,-4);ictx.fillStyle=CYAN;ictx.shadowColor=CYAN;ictx.shadowBlur=25;ictx.fillText(iName,adjX,CY);ictx.restore();
  }

  // SCANLINE FLICKER 1.0-1.8s
  if(iT>=1.0&&iT<1.8){
    const scanAlpha=0.04+Math.sin(iT*80)*0.03;
    for(let y=0;y<H;y+=4){ictx.fillStyle=`rgba(0,0,0,${scanAlpha})`;ictx.fillRect(0,y,W,2);}
  }

  // LIGHTNING BOLTS 1.6-2.2s
  if(iT>=1.6&&iT<1.68&&iBolts.length===0){
    for(let i=0;i<7;i++)makeBolt(rand(-120,W*0.25),rand(CY-150,CY+150),rand(W*0.75,W+120),rand(CY-150,CY+150),pick([CYAN,YELLOW,WHITE,PINK]));
    spawnEmbers(CX,CY,60);
  }
  iBolts=iBolts.filter(b=>b.alpha>0.02);
  for(const b of iBolts){
    b.alpha-=0.032;
    ictx.beginPath();ictx.moveTo(b.pts[0][0],b.pts[0][1]);
    for(let i=1;i<b.pts.length;i++)ictx.lineTo(b.pts[i][0],b.pts[i][1]);
    ictx.strokeStyle=b.col;ictx.lineWidth=b.w;ictx.globalAlpha=b.alpha;
    ictx.shadowColor=b.col;ictx.shadowBlur=30;ictx.stroke();ictx.globalAlpha=1;ictx.shadowBlur=0;
  }

  // TAGLINE 2.0s+
  if(iT>=2.0){
    const tp=Math.min(1,(iT-2.0)/0.32);
    const ep=easeOut(tp);
    const tAlpha=iT>5.6?Math.max(0,1-(iT-5.6)*2.2):Math.min(1,ep*1.6);
    const tfs=Math.floor(H*0.052);
    ictx.font=`bold ${tfs}px Impact,sans-serif`;
    ictx.textBaseline='middle';
    const tagW=ictx.measureText('LIVE TONIGHT').width;
    const tagX=CX-tagW/2;
    const tagY=CY+H*0.175+(1-ep)*H*0.28;
    ictx.save();ictx.globalAlpha=tAlpha;
    ictx.fillStyle=CYAN;ictx.shadowColor=CYAN;ictx.shadowBlur=35;
    ictx.fillText('LIVE TONIGHT',tagX,tagY);ictx.restore();
    if(tp>0.55){
      const ulP=Math.min(1,(tp-0.55)/0.45);
      const ulY=tagY+tfs*0.82;
      ictx.beginPath();ictx.moveTo(tagX-12,ulY);ictx.lineTo(tagX-12+(tagW+24)*ulP,ulY);
      ictx.strokeStyle=PINK;ictx.lineWidth=3.5;ictx.shadowColor=PINK;ictx.shadowBlur=18;
      ictx.globalAlpha=tAlpha;ictx.stroke();ictx.globalAlpha=1;ictx.shadowBlur=0;
    }
  }

  // GLITCH 2.5-3.3s
  if(iT>=2.5&&iT<3.3){
    if(Math.random()>0.38){
      for(let i=0;i<10;i++){
        ictx.fillStyle=pick(NEONS);ictx.globalAlpha=rand(0.08,0.38);
        ictx.fillRect(rand(0,W),rand(0,H),rand(W*0.08,W*0.65),rand(2,22));
      }
      ictx.globalAlpha=1;
    }
  }

  // PULSE SHOCKWAVES 3.2-5.5s
  if(iT>=3.2&&iT<5.5){
    if(Math.floor(iT*1.1)>Math.floor((iT-dt)*1.1)){
      addShock(CX,CY-H*0.04,CYAN);
      spawnEmbers(rand(CX-200,CX+200),CY,12);
    }
  }

  // FADE OUT
  if(iT>5.6){
    const fa=Math.min(1,(iT-5.6)/0.65);
    ictx.fillStyle=`rgba(0,0,0,${fa})`;ictx.fillRect(0,0,W,H);
  }

  if(iT<6.4){requestAnimationFrame(drawIntro);}
  else{
    ic.style.display='none';wc.style.display='block';
    skipBtn.style.display='none';
    if(remaining.length>0){spinBtn.disabled=false;spinBtn.textContent='⚡ SPIN AGAIN';}
    actLabel.style.opacity='0';
  }
}

function fireIntro(name){
  iName=name;iT=0;iActive=true;
  iPart=[];iShock=[];iBolts=[];iEmbers=[];
  buildLetters(name);
  wc.style.display='none';ic.style.display='block';skipBtn.style.display='block';
  requestAnimationFrame(drawIntro);
}

skipBtn.addEventListener('click',()=>{
  iT=99;ic.style.display='none';wc.style.display='block';
  skipBtn.style.display='none';
  if(remaining.length>0){spinBtn.disabled=false;spinBtn.textContent='⚡ SPIN AGAIN';}
  actLabel.style.opacity='0';
});
</script>
